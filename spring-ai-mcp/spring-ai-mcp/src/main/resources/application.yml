server:
  port: 8088
  main:
    banner-mode: off
    allow-bean-definition-overriding: true
  ai:
    mcp:
      server:
        type: async
        enabled: true
        base-path: /mcp
        cors:
          allowed-origins: "*"
          allowed-methods: GET,POST,PUT,DELETE,OPTIONS

management:
  endpoints:
    web:
      exposure:
        include: mappings,conditions,beans,env
